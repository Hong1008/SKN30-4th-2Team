name: Destroy production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type exactly DESTROY workshield-prod
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: workshield-production
  cancel-in-progress: false

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: production-destroy
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - name: Require exact destruction confirmation
        run: test "$CONFIRMATION" = 'DESTROY workshield-prod'
      - name: Configure short-lived AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.1
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: workshield-destroy-${{ github.run_id }}
          mask-aws-account-id: true
      - name: Install RunPod CLI without persisting its API key
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/runpod/runpodctl/releases/latest/download/runpodctl-linux-amd64 \
            --output "$RUNNER_TEMP/runpodctl"
          chmod 0755 "$RUNNER_TEMP/runpodctl"
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Destroy only WorkShield-owned production resources
        run: bash deploy/aws/scripts/destroy-project.sh --confirmation "$CONFIRMATION"
