name: Publish container images

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to build
        required: true
        default: main
        type: string
      image_tag:
        description: Immutable tag shared by the API and MCP images
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-containers-${{ inputs.image_tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: api
            dockerfile: api/Dockerfile
          - component: mcp
            context: mcp
            dockerfile: mcp/Dockerfile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_ref }}
          submodules: recursive
      - name: Validate release coordinates
        env:
          RAW_IMAGE_TAG: ${{ inputs.image_tag }}
          CONFIGURED_GHCR_OWNER: ${{ vars.GHCR_OWNER }}
        run: |
          set -euo pipefail
          [[ "$RAW_IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]
          owner="${CONFIGURED_GHCR_OWNER:-$GITHUB_REPOSITORY_OWNER}"
          owner="${owner,,}"
          repository="${GITHUB_REPOSITORY#*/}"
          repository="${repository,,}"
          [[ "$owner" =~ ^[a-z0-9][a-z0-9._-]*$ ]]
          [[ "$repository" =~ ^[a-z0-9][a-z0-9._-]*$ ]]
          printf 'IMAGE_TAG=%s\n' "$RAW_IMAGE_TAG" >> "$GITHUB_ENV"
          printf 'IMAGE_REPOSITORY=ghcr.io/%s/%s\n' "$owner" "$repository" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish immutable ${{ matrix.component }} image
        env:
          COMPONENT: ${{ matrix.component }}
          BUILD_CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          candidate="workshield-${COMPONENT}:candidate-${GITHUB_RUN_ID}"
          image="${IMAGE_REPOSITORY}/${COMPONENT}:${IMAGE_TAG}"

          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${source_sha}" \
            --file "$DOCKERFILE" \
            --tag "$candidate" \
            "$BUILD_CONTEXT"

          if docker manifest inspect "$image" >/dev/null 2>&1; then
            docker pull "$image"
            candidate_id="$(docker image inspect --format '{{.Id}}' "$candidate")"
            published_id="$(docker image inspect --format '{{.Id}}' "$image")"
            if [[ "$candidate_id" != "$published_id" ]]; then
              echo "::error::Refusing to overwrite immutable image tag: $image"
              exit 1
            fi
            echo "Image tag already contains the requested build: $image"
          else
            docker tag "$candidate" "$image"
            docker push "$image"
          fi

          digest="$(docker buildx imagetools inspect "$image" | awk '$1 == "Digest:" {print $2; exit}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '### %s\n\n`%s@%s`\n' "$COMPONENT" "${IMAGE_REPOSITORY}/${COMPONENT}" "$digest" >> "$GITHUB_STEP_SUMMARY"
