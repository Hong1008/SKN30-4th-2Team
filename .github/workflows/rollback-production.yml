name: Roll back production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 40-character lowercase Git SHA to restore
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: workshield-production
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      RELEASE_SHA: ${{ inputs.release_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check out the web source that belongs to the restored release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_sha }}
          path: restored-release
      - name: Validate rollback release and GHCR manifests
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for component in api mcp embed-rerank; do
            docker manifest inspect "ghcr.io/${owner}/skn30-4th-2team/${component}:${RELEASE_SHA}" >/dev/null
          done
      - name: Configure short-lived AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.1
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: workshield-rollback-${{ github.run_id }}
          mask-aws-account-id: true
      - name: Install current secret-free runtime assets
        run: bash deploy/aws/scripts/install-runtime-assets.sh
      - name: Roll back containers through SSM and verify health
        run: |
          bash deploy/aws/scripts/dispatch-ssm-command.sh --release-sha "$RELEASE_SHA"
      - name: Restore web release and invalidate CloudFront
        run: |
          bucket="$(aws cloudformation describe-stacks --stack-name WorkShieldService --query "Stacks[0].Outputs[?OutputKey=='WebBucketName'].OutputValue" --output text)"
          distribution_id="$(aws cloudformation describe-stacks --stack-name WorkShieldService --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" --output text)"
          bash deploy/aws/scripts/deploy-web.sh --release-sha "$RELEASE_SHA" --bucket "$bucket" --distribution-id "$distribution_id" --web-dir restored-release/web
