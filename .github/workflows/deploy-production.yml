name: Deploy production

on:
  workflow_dispatch:
    inputs:
      ghcr_owner:
        description: GHCR owner (package names are fixed by this workflow)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: workshield-production
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      ghcr_owner: ${{ steps.values.outputs.ghcr_owner }}
      release_sha: ${{ steps.values.outputs.release_sha }}
    steps:
      - id: values
        env:
          RAW_GHCR_OWNER: ${{ inputs.ghcr_owner }}
        run: |
          owner="${RAW_GHCR_OWNER,,}"
          [[ "$owner" =~ ^[a-z0-9][a-z0-9._-]*$ ]]
          printf 'ghcr_owner=%s\n' "$owner" >> "$GITHUB_OUTPUT"
          printf 'release_sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  build-images:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: api
            context: api
            file: api/Dockerfile
          - suffix: mcp
            context: mcp
            file: mcp/Dockerfile
          - suffix: embed-rerank
            context: mcp
            file: mcp/deploy/runpod_worker/Pod.Dockerfile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - name: Log in to GHCR with the job token
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish immutable ${{ matrix.suffix }} image
        env:
          GHCR_OWNER: ${{ needs.prepare.outputs.ghcr_owner }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          image="ghcr.io/${GHCR_OWNER}/skn30-4th-2team/${{ matrix.suffix }}:${RELEASE_SHA}"
          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${RELEASE_SHA}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --file "${{ matrix.file }}" \
            --tag "$image" \
            "${{ matrix.context }}"
          docker push "$image"

  deploy:
    needs: [prepare, build-images]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Validate production environment identifiers
        run: |
          test -n "$AWS_REGION"
          test -n "$AWS_DEPLOY_ROLE_ARN"
          test -n "$RUNPOD_API_KEY"
      - name: Configure short-lived AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.1
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: workshield-${{ github.run_id }}
          mask-aws-account-id: true
      - name: Install RunPod CLI without persisting its API key
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/runpod/runpodctl/releases/latest/download/runpodctl-linux-amd64 \
            --output "$RUNNER_TEMP/runpodctl"
          chmod 0755 "$RUNNER_TEMP/runpodctl"
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Prepare locked deployment tooling
        run: python -m pip install --disable-pip-version-check uv==0.11.2
      - name: Deploy foundation stack and verify runtime secret bootstrap
        working-directory: deploy/aws/iac
        run: |
          test -f ../config/prod.json
          uv sync --frozen --no-dev
          npm ci
          npm exec cdk -- deploy WorkShieldFoundation --require-approval never --context config=../config/prod.json
          aws secretsmanager describe-secret --secret-id /workshield/prod/vllm >/dev/null
          aws secretsmanager describe-secret --secret-id /workshield/prod/embed >/dev/null
      - name: Reconcile authenticated RunPod Pods
        env:
          VLLM_SECRET_ID: /workshield/prod/vllm
          EMBED_SECRET_ID: /workshield/prod/embed
          GHCR_OWNER: ${{ needs.prepare.outputs.ghcr_owner }}
        run: |
          vllm_key="$(aws secretsmanager get-secret-value --secret-id "$VLLM_SECRET_ID" --query SecretString --output text | jq -er '.VLLM_API_KEY')"
          embed_key="$(aws secretsmanager get-secret-value --secret-id "$EMBED_SECRET_ID" --query SecretString --output text | jq -er '.RUNPOD_EMBED_API_KEY')"
          printf '::add-mask::%s\n' "$vllm_key"
          printf '::add-mask::%s\n' "$embed_key"
          export VLLM_API_KEY="$vllm_key"
          export RUNPOD_EMBED_API_KEY="$embed_key"
          python3 deploy/llm_pod/deploy_llm_pod.py --state-backend aws --environment prod --name workshield-prod-llm --output json --no-env-file --wait
          python3 mcp/deploy/deploy_embed_pod.py --state-backend aws --environment prod --name workshield-prod-embed --output json --no-env-file --wait
      - name: Deploy service stack
        working-directory: deploy/aws/iac
        run: npm exec cdk -- deploy WorkShieldService --require-approval never --context config=../config/prod.json
      - name: Request the SSM release deployment
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          command_id="$(aws ssm send-command \
            --document-name workshield-prod-deploy \
            --targets 'Key=tag:Project,Values=WorkShield' \
            --parameters "ReleaseSha=${RELEASE_SHA}" \
            --comment "WorkShield release ${RELEASE_SHA}" \
            --query 'Command.CommandId' --output text)"
          test -n "$command_id"
          printf 'SSM release command submitted: %s\n' "$command_id" >> "$GITHUB_STEP_SUMMARY"
