name: Deploy production

on:
  workflow_dispatch:
    inputs:
      ghcr_owner:
        description: GHCR owner (package names are fixed by this workflow)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: workshield-production
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      ghcr_owner: ${{ steps.values.outputs.ghcr_owner }}
      release_sha: ${{ steps.values.outputs.release_sha }}
    steps:
      - id: values
        env:
          RAW_GHCR_OWNER: ${{ inputs.ghcr_owner }}
        run: |
          owner="${RAW_GHCR_OWNER,,}"
          [[ "$owner" =~ ^[a-z0-9][a-z0-9._-]*$ ]]
          printf 'ghcr_owner=%s\n' "$owner" >> "$GITHUB_OUTPUT"
          printf 'release_sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  build-images:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: api
            context: api
            file: api/Dockerfile
          - suffix: mcp
            context: mcp
            file: mcp/Dockerfile
          - suffix: embed-rerank
            context: mcp
            file: mcp/deploy/runpod_worker/Pod.Dockerfile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - name: Log in to GHCR with the job token
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish immutable ${{ matrix.suffix }} image
        env:
          GHCR_OWNER: ${{ needs.prepare.outputs.ghcr_owner }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          image="ghcr.io/${GHCR_OWNER}/skn30-4th-2team/${{ matrix.suffix }}:${RELEASE_SHA}"
          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${RELEASE_SHA}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --file "${{ matrix.file }}" \
            --tag "$image" \
            "${{ matrix.context }}"
          docker push "$image"

  deploy:
    needs: [prepare, build-images]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_AVAILABILITY_ZONE: ${{ vars.AWS_AVAILABILITY_ZONE }}
      ORIGIN_DOMAIN: ${{ vars.ORIGIN_DOMAIN }}
      HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
      HOSTED_ZONE_NAME: ${{ vars.HOSTED_ZONE_NAME }}
      CLOUDFRONT_ORIGIN_PREFIX_LIST_ID: ${{ vars.CLOUDFRONT_ORIGIN_PREFIX_LIST_ID }}
      NGINX_IMAGE: ${{ vars.NGINX_IMAGE }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Validate production environment identifiers
        run: |
          test -n "$AWS_REGION"
          test -n "$AWS_DEPLOY_ROLE_ARN"
          test -n "$AWS_ACCOUNT_ID"
          test -n "$AWS_AVAILABILITY_ZONE"
          test -n "$ORIGIN_DOMAIN"
          test -n "$HOSTED_ZONE_ID"
          test -n "$HOSTED_ZONE_NAME"
          test -n "$CLOUDFRONT_ORIGIN_PREFIX_LIST_ID"
          test -n "$NGINX_IMAGE"
          test -n "$RUNPOD_API_KEY"
      - name: Configure short-lived AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.1
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: workshield-${{ github.run_id }}
          mask-aws-account-id: true
      - name: Install RunPod CLI without persisting its API key
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/runpod/runpodctl/releases/latest/download/runpodctl-linux-amd64 \
            --output "$RUNNER_TEMP/runpodctl"
          chmod 0755 "$RUNNER_TEMP/runpodctl"
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Prepare locked deployment tooling
        run: python -m pip install --disable-pip-version-check uv==0.11.2
      - name: Build temporary CDK configuration from production variables
        run: |
          bash deploy/aws/scripts/write-deployment-config.sh \
            --output deploy/aws/config/prod.json \
            --account-id "$AWS_ACCOUNT_ID" \
            --region "$AWS_REGION" \
            --availability-zone "$AWS_AVAILABILITY_ZONE" \
            --origin-domain "$ORIGIN_DOMAIN" \
            --hosted-zone-id "$HOSTED_ZONE_ID" \
            --hosted-zone-name "$HOSTED_ZONE_NAME" \
            --cloudfront-prefix-list-id "$CLOUDFRONT_ORIGIN_PREFIX_LIST_ID"
      - name: Deploy foundation stack and verify runtime secret bootstrap
        working-directory: deploy/aws/iac
        run: |
          uv sync --frozen --no-dev
          npm ci
          npm exec cdk -- deploy WorkShieldFoundation --require-approval never --context config=../config/prod.json
          aws secretsmanager describe-secret --secret-id /workshield/prod/vllm >/dev/null
          aws secretsmanager describe-secret --secret-id /workshield/prod/embed >/dev/null
      - name: Verify required runtime secret fields without logging values
        run: |
          origin_header="$(aws secretsmanager get-secret-value --secret-id /workshield/prod/origin-header --query SecretString --output text | jq -er '.ORIGIN_HEADER')"
          law_oc="$(aws secretsmanager get-secret-value --secret-id /workshield/prod/law --query SecretString --output text | jq -er '.LAW_OC')"
          test -n "$origin_header"
          test -n "$law_oc"
          printf '::add-mask::%s\n' "$origin_header"
          printf '::add-mask::%s\n' "$law_oc"
          unset origin_header law_oc
      - name: Reconcile authenticated RunPod Pods
        env:
          VLLM_SECRET_ID: /workshield/prod/vllm
          EMBED_SECRET_ID: /workshield/prod/embed
          GHCR_OWNER: ${{ needs.prepare.outputs.ghcr_owner }}
        run: |
          vllm_key="$(aws secretsmanager get-secret-value --secret-id "$VLLM_SECRET_ID" --query SecretString --output text | jq -er '.VLLM_API_KEY')"
          embed_key="$(aws secretsmanager get-secret-value --secret-id "$EMBED_SECRET_ID" --query SecretString --output text | jq -er '.RUNPOD_EMBED_API_KEY')"
          test -n "$vllm_key"
          test -n "$embed_key"
          printf '::add-mask::%s\n' "$vllm_key"
          printf '::add-mask::%s\n' "$embed_key"
          export VLLM_API_KEY="$vllm_key"
          export RUNPOD_EMBED_API_KEY="$embed_key"
          python3 deploy/llm_pod/deploy_llm_pod.py --state-backend aws --environment prod --name workshield-prod-llm --output json --no-env-file --wait
          python3 mcp/deploy/deploy_embed_pod.py --state-backend aws --environment prod --name workshield-prod-embed --output json --no-env-file --wait
      - name: Set non-secret runtime parameters
        env:
          GHCR_OWNER: ${{ needs.prepare.outputs.ghcr_owner }}
        run: |
          bash deploy/aws/scripts/set-runtime-parameters.sh \
            --ghcr-owner "$GHCR_OWNER" \
            --nginx-image "$NGINX_IMAGE" \
            --origin-domain "$ORIGIN_DOMAIN"
      - name: Deploy service stack
        working-directory: deploy/aws/iac
        run: npm exec cdk -- deploy WorkShieldService --require-approval never --context config=../config/prod.json
      - name: Install secret-free runtime assets on the managed node
        run: bash deploy/aws/scripts/install-runtime-assets.sh
      - name: Deploy containers through SSM and verify health
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: bash deploy/aws/scripts/dispatch-ssm-command.sh --release-sha "$RELEASE_SHA"
      - name: Deploy verified web release and invalidate CloudFront
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          bucket="$(aws cloudformation describe-stacks --stack-name WorkShieldService --query "Stacks[0].Outputs[?OutputKey=='WebBucketName'].OutputValue" --output text)"
          distribution_id="$(aws cloudformation describe-stacks --stack-name WorkShieldService --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" --output text)"
          bash deploy/aws/scripts/deploy-web.sh --release-sha "$RELEASE_SHA" --bucket "$bucket" --distribution-id "$distribution_id"
