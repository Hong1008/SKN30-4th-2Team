name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# PR과 main CI는 소스 읽기 외의 권한을 갖지 않는다.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install locked Python tooling
        run: python -m pip install --disable-pip-version-check uv==0.11.2
      - name: Lint and test API
        working-directory: api
        run: |
          uv sync --frozen --all-groups
          uv run ruff check app main.py tests
          uv run pytest -q

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install locked Python tooling
        run: python -m pip install --disable-pip-version-check uv==0.11.2
      - name: Test MCP
        working-directory: mcp
        run: |
          uv sync --frozen
          uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Type-check, test, and build web
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

  container-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: api
            file: api/Dockerfile
          - name: mcp
            context: mcp
            file: mcp/Dockerfile
          - name: embed-rerank
            context: mcp
            file: mcp/deploy/runpod_worker/Pod.Dockerfile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - name: Build ${{ matrix.name }} image without publishing
        run: |
          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --file "${{ matrix.file }}" \
            --tag "workshield/${{ matrix.name }}:ci" \
            "${{ matrix.context }}"

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate production Compose interpolation
        run: docker compose --env-file deploy/aws/env/prod.env.example -f deploy/aws/compose.prod.yaml config --quiet

  cdk-synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install locked Python tooling
        run: python -m pip install --disable-pip-version-check uv==0.11.2
      - name: Synthesize CDK templates
        working-directory: deploy/aws/iac
        run: |
          uv sync --frozen --no-dev
          npm ci
          npm exec cdk -- synth
