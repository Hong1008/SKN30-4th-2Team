AWSTemplateFormatVersion: '2010-09-09'
Description: WorkShield GitHub Actions OIDC deploy role bootstrap
Parameters:
  GitHubOrganization:
    Type: String
    Default: Hong1008
  GitHubRepository:
    Type: String
    Default: SKN30-4th-2Team
  GitHubEnvironment:
    Type: String
    Default: production
  GitHubDestructionEnvironment:
    Type: String
    Default: production-destroy
  DeployRoleName:
    Type: String
    Default: workshield-prod-github-deploy
  BootstrapQualifier:
    Type: String
    Default: hnb659fds
Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
  WorkShieldInfrastructurePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: workshield-prod-infrastructure
      Description: Least-privilege boundary for WorkShield CDK CloudFormation execution.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [ec2:*, cloudfront:*, s3:*, ssm:*, secretsmanager:*, logs:*, cloudwatch:*]
            Resource: '*'
          - Effect: Allow
            Action:
              - lambda:AddPermission
              - lambda:CreateFunction
              - lambda:DeleteFunction
              - lambda:GetFunction
              - lambda:InvokeFunction
              - lambda:ListTags
              - lambda:RemovePermission
              - lambda:TagResource
              - lambda:UntagResource
              - lambda:UpdateFunctionCode
              - lambda:UpdateFunctionConfiguration
            Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:WorkShieldService-*
          - Effect: Allow
            Action:
              - iam:CreateRole
              - iam:DeleteRole
              - iam:GetRole
              - iam:GetRolePolicy
              - iam:ListRolePolicies
              - iam:PassRole
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
              - iam:PutRolePolicy
              - iam:DeleteRolePolicy
              - iam:CreateInstanceProfile
              - iam:DeleteInstanceProfile
              - iam:GetInstanceProfile
              - iam:AddRoleToInstanceProfile
              - iam:RemoveRoleFromInstanceProfile
              - iam:TagRole
              - iam:TagInstanceProfile
            Resource:
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/workshield-*
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/WorkShield*
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/workshield-*
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/WorkShield*
  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: workshield-prod-cfn-execution
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudformation.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns: [!Ref WorkShieldInfrastructurePolicy]
  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref DeployRoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOrganization}/${GitHubRepository}:environment:${GitHubEnvironment}
                  - !Sub repo:${GitHubOrganization}/${GitHubRepository}:environment:${GitHubDestructionEnvironment}
      Policies:
        - PolicyName: WorkShieldDeployOrchestration
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [cloudformation:CreateChangeSet, cloudformation:Describe*, cloudformation:ExecuteChangeSet, cloudformation:DeleteChangeSet, cloudformation:DeleteStack]
                Resource: '*'
              - Effect: Allow
                Action: sts:AssumeRole
                Resource:
                  - !GetAtt CloudFormationExecutionRole.Arn
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-${BootstrapQualifier}-deploy-role-${AWS::AccountId}-${AWS::Region}
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-${BootstrapQualifier}-file-publishing-role-${AWS::AccountId}-${AWS::Region}
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-${BootstrapQualifier}-image-publishing-role-${AWS::AccountId}-${AWS::Region}
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-${BootstrapQualifier}-lookup-role-${AWS::AccountId}-${AWS::Region}
              - Effect: Allow
                Action: [s3:ListBucket, s3:GetObject, s3:PutObject, s3:DeleteObject, cloudfront:CreateInvalidation, cloudfront:GetDistribution, cloudfront:GetInvalidation, ec2:DescribeInstances]
                Resource: '*'
              - Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters, ssm:GetParametersByPath, ssm:PutParameter, ssm:DeleteParameters, ssm:SendCommand, ssm:GetCommandInvocation, ssm:ListCommandInvocations]
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/workshield/prod/*
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cdk-bootstrap/${BootstrapQualifier}/version
              - Effect: Allow
                Action: [secretsmanager:DescribeSecret, secretsmanager:GetSecretValue, secretsmanager:DeleteSecret]
                Resource: '*'
Outputs:
  GitHubDeployRoleArn:
    Value: !GetAtt GitHubDeployRole.Arn
  CloudFormationExecutionRoleArn:
    Value: !GetAtt CloudFormationExecutionRole.Arn
  WorkShieldInfrastructurePolicyArn:
    Value: !Ref WorkShieldInfrastructurePolicy
