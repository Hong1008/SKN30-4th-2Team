name: workshield-prod

services:
  nginx:
    image: ${NGINX_IMAGE:?NGINX_IMAGE must be set to a pinned official Nginx image}
    restart: unless-stopped
    ports:
      - "443:443"
    environment:
      ORIGIN_DOMAIN: ${ORIGIN_DOMAIN:?ORIGIN_DOMAIN must be set}
      ORIGIN_HEADER: ${ORIGIN_HEADER:?ORIGIN_HEADER must be provided at runtime}
    volumes:
      - type: bind
        source: ./nginx/nginx.conf.template
        target: /etc/nginx/templates/default.conf.template
        read_only: true
      - type: bind
        source: /opt/workshield/certificates
        target: /opt/workshield/certificates
        read_only: true
    depends_on:
      api:
        condition: service_healthy
    networks:
      - workshield

  api:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER must be set}/skn30-4th-2team/api:${RELEASE_SHA:?RELEASE_SHA must be set}
    restart: unless-stopped
    env_file:
      - path: ${API_ENV_FILE:-/opt/workshield/secrets/api.env}
        required: false
    environment:
      APP_ENV: prod
      LLM_PROVIDER: vllm
      APP_DEBUG: "false"
      API_DOCS_ENABLED: "false"
      DATABASE_ECHO: "false"
      DATABASE_URL: sqlite+pysqlite:////app/data/workshield.db
      WORKSHIELD_MCP_TRANSPORT: streamable_http
      WORKSHIELD_MCP_URL: http://mcp:8000/mcp
    volumes:
      - type: bind
        source: ${WORKSHIELD_DATA_DIR:-/opt/workshield/data}/api
        target: /app/data
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=5).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      mcp:
        condition: service_healthy
    networks:
      - workshield

  mcp:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER must be set}/skn30-4th-2team/mcp:${RELEASE_SHA:?RELEASE_SHA must be set}
    restart: unless-stopped
    env_file:
      - path: ${MCP_ENV_FILE:-/opt/workshield/secrets/mcp.env}
        required: false
    environment:
      APP_ENV: prod
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
    volumes:
      - type: bind
        source: ${WORKSHIELD_DATA_DIR:-/opt/workshield/data}/mcp-uploads
        target: /app/data/99_uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=5).close()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - workshield

networks:
  workshield:
    driver: bridge
