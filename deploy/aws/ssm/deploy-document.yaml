schemaVersion: '2.2'
description: Deploy a verified WorkShield release without including secrets in SSM parameters.
parameters:
  ReleaseSha:
    type: String
    allowedPattern: '^[0-9a-f]{40}$'
mainSteps:
  - action: aws:runShellScript
    name: deploy
    inputs:
      runCommand:
        - /opt/workshield/deploy-containers.sh --release-sha '{{ ReleaseSha }}'
